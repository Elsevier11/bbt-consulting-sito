<script>
const TERMS = [{"term": "LLM", "full": "Large Language Model", "cat": "architettura", "def": "Un sistema di intelligenza artificiale addestrato su enormi quantità di testo per comprendere e generare linguaggio umano in modo coerente e contestuale.", "esempio": "GPT-4, Claude e Gemini sono tutti LLM. Quando scrivi un prompt e ricevi una risposta articolata, stai interagendo con un LLM."}, {"term": "Transformer", "full": "Architettura Transformer", "cat": "architettura", "def": "Il design computazionale alla base di tutti i principali LLM moderni. Permette al modello di valutare quanto ogni parola del testo sia rilevante rispetto alle altre, cogliendo il contesto anche a distanza.", "esempio": "Grazie ai Transformer, un LLM capisce che 'la banca' in 'ho depositato soldi in banca' ha significato diverso che in 'mi sono seduto sulla banca del fiume'."}, {"term": "Token", "full": "Token", "cat": "architettura", "def": "L'unità minima di testo che un LLM elabora. Può corrispondere a una parola intera, a una sua parte o a un simbolo di punteggiatura. I costi API e i limiti del modello sono misurati in token.", "esempio": "La parola 'negoziazione' conta come ~4 token. Una pagina di testo equivale a circa 700 token. Rilevante per stimare i costi di utilizzo via API."}, {"term": "Context window", "full": "Finestra di contesto", "cat": "architettura", "def": "La quantità massima di testo (misurata in token) che un LLM può 'vedere' e considerare in una singola sessione. Oltre questo limite, il modello non ricorda ciò che è avvenuto prima.", "esempio": "Claude 3 ha una context window di 200.000 token — abbastanza per analizzare un intero contratto quadro di più pagine in un'unica sessione."}, {"term": "Fine-tuning", "full": "Affinamento del modello", "cat": "architettura", "def": "Un processo di addestramento aggiuntivo che specializza un modello generico su dati specifici di un dominio, migliorandone le prestazioni in quel contesto.", "esempio": "Un'azienda assicurativa potrebbe fare fine-tuning su migliaia di polizze per ottenere un modello che risponde con la terminologia e lo stile della propria documentazione."}, {"term": "Embedding", "full": "Rappresentazione vettoriale", "cat": "architettura", "def": "La trasformazione di un testo in un vettore numerico che ne cattura il significato semantico. Testi semanticamente simili producono vettori 'vicini' nello spazio matematico.", "esempio": "Gli embedding permettono di trovare 'clausola di rescissione' anche cercando 'condizioni di uscita dal contratto', perché i due concetti sono semanticamente vicini."}, {"term": "Foundation model", "full": "Modello fondazionale", "cat": "architettura", "def": "Un modello AI molto grande, addestrato su dati generali e diversificati, progettato per essere adattato a molteplici compiti specifici senza ripartire da zero.", "esempio": "GPT-4 è un foundation model: può essere usato tal quale per conversazioni generali, oppure specializzato via fine-tuning per applicazioni verticali."}, {"term": "Multimodale", "full": "Modello multimodale", "cat": "architettura", "def": "Un modello capace di elaborare e generare diversi tipi di contenuto — testo, immagini, audio, video — all'interno della stessa sessione.", "esempio": "Claude 3 e GPT-4 Vision sono multimodali: puoi caricare un grafico di bilancio e chiedere 'Quali sono i tre trend principali?' senza trascrivere i dati."}, {"term": "Inferenza", "full": "Inferenza", "cat": "architettura", "def": "Il processo attraverso cui un modello AI genera un output a partire da un input. In produzione, 'fare inferenza' significa 'usare il modello per produrre una risposta'.", "esempio": "Ogni volta che invii un prompt, il server esegue inferenza. La velocità di risposta (latenza) dipende dalla dimensione del modello e dall'infrastruttura di inferenza."}, {"term": "Prompt", "full": "Prompt", "cat": "interazione", "def": "L'istruzione, domanda o testo che si fornisce a un LLM per ottenere un output. È l'interfaccia principale tra l'utente e il modello: la qualità del prompt determina in larga misura la qualità della risposta.", "esempio": "'Scrivi un'email professionale per rifiutare un'offerta commerciale mantenendo la relazione' è un prompt. Più è specifico e contestualizzato, più la risposta sarà utile."}, {"term": "System prompt", "full": "System prompt", "cat": "interazione", "def": "Un set di istruzioni configurate prima dell'inizio della conversazione che definiscono il comportamento, il ruolo e i limiti dell'agente AI. Di norma invisibili all'utente finale.", "esempio": "Il system prompt di SalesPrep AI stabilisce che il modello deve comportarsi da Sales Coach, seguire un flusso in 4 fasi e attendere l'input prima di avanzare."}, {"term": "Prompt engineering", "full": "Prompt engineering", "cat": "interazione", "def": "La pratica di progettare e ottimizzare prompt per ottenere output accurati, coerenti e utili da un LLM. Include tecniche di strutturazione, contestualizzazione e iterazione.", "esempio": "Il framework C·O·C·V (Contesto · Obiettivo · Compito · Vincoli) è una tecnica di prompt engineering che struttura le istruzioni per massimizzare la pertinenza della risposta."}, {"term": "Temperature", "full": "Temperatura", "cat": "interazione", "def": "Un parametro che controlla il grado di variabilità delle risposte del modello. Valori bassi (es. 0.1) producono output più deterministici e prevedibili; valori alti (es. 0.9) output più creativi e diversificati.", "esempio": "Per analizzare un bilancio si usa temperatura bassa (precisione); per generare idee di campagna marketing si usa temperatura alta (creatività)."}, {"term": "Chain of thought", "full": "Ragionamento a catena", "cat": "interazione", "def": "Una tecnica che istruisce il LLM a esplicitare il ragionamento passo per passo prima di fornire la risposta finale. Migliora significativamente l'accuratezza su problemi complessi.", "esempio": "Aggiungere 'Ragiona passo per passo' a un prompt di analisi finanziaria riduce gli errori di calcolo perché il modello esplicita ogni passaggio prima di concludere."}, {"term": "Zero-shot / Few-shot", "full": "Zero-shot e few-shot prompting", "cat": "interazione", "def": "Zero-shot: chiedere al modello di svolgere un compito senza fornire esempi. Few-shot: includere 2-5 esempi nel prompt per mostrare il formato o lo stile atteso della risposta.", "esempio": "Per generare schede prodotto nel formato aziendale, includere 2-3 esempi di schede esistenti (few-shot) produce output molto più aderenti allo standard rispetto a una richiesta generica."}, {"term": "Conversation starter", "full": "Conversation starter", "cat": "interazione", "def": "Una frase preimpostata che avvia una conversazione con un agente AI in modo mirato. Guida l'utente verso le funzionalità chiave e riduce la frizione nell'utilizzo.", "esempio": "'Preparami a presentare un'offerta commerciale per un cliente B2B' è un conversation starter di SalesPrep AI: avvia direttamente la fase 1 senza che l'utente debba capire come usare l'agente."}, {"term": "Grounding", "full": "Ancoraggio al contesto", "cat": "interazione", "def": "La pratica di vincolare le risposte del modello a fonti verificate o a un contesto specifico fornito dall'utente, riducendo il rischio di allucinazioni e aumentando l'affidabilità.", "esempio": "'Rispondi esclusivamente sulla base dei documenti che ti ho allegato e segnala se qualcosa non è coperto dalla documentazione' è un'istruzione di grounding."}, {"term": "RAG", "full": "Retrieval-Augmented Generation", "cat": "applicazioni", "def": "Un'architettura che combina un LLM con un sistema di recupero di documenti: il modello cerca informazioni rilevanti in una knowledge base prima di generare la risposta, rendendola più accurata e aggiornata.", "esempio": "Un chatbot aziendale che risponde alle domande dei dipendenti sulle policy HR consultando in tempo reale i documenti interni è implementato con RAG."}, {"term": "Agente AI", "full": "AI Agent", "cat": "applicazioni", "def": "Un sistema AI configurato per svolgere compiti specifici in modo semi-autonomo, spesso attraverso sequenze di azioni multi-step. Va oltre il semplice chatbot: può pianificare, usare strumenti e adattare il comportamento in base al contesto.", "esempio": "SalesPrep AI è un agente: non risponde a domande generiche, ma guida il venditore attraverso 4 fasi strutturate (discovery, audit, playbook, simulazione) adattando ogni risposta al contesto specifico."}, {"term": "Plugin / Tool use", "full": "Utilizzo di strumenti esterni", "cat": "applicazioni", "def": "La capacità di un LLM di richiamare strumenti esterni durante una conversazione: ricerca web, calcoli, database, API. Estende le capacità del modello oltre la conoscenza acquisita in fase di addestramento.", "esempio": "ChatGPT con plugin attivi può cercare dati aggiornati sul web o eseguire calcoli finanziari complessi che il modello da solo non potrebbe fare in modo affidabile."}, {"term": "Vector database", "full": "Database vettoriale", "cat": "applicazioni", "def": "Un database specializzato nell'archiviare e interrogare embedding (rappresentazioni numeriche di testi). Permette ricerche semantiche su grandi volumi di documenti. Componente chiave dei sistemi RAG.", "esempio": "Una società di consulenza potrebbe archiviare migliaia di report precedenti in un vector database: un LLM può così cercare 'casi simili a questo' anche se le parole usate sono diverse."}, {"term": "Knowledge base", "full": "Base di conoscenza", "cat": "applicazioni", "def": "L'insieme strutturato di documenti, dati e informazioni a cui un agente AI può accedere per rispondere a domande specifiche del dominio.", "esempio": "La knowledge base di un assistente HR può includere contratti collettivi, policy aziendali, procedure di onboarding: l'agente risponde solo sulla base di queste fonti verificate."}, {"term": "Copilot", "full": "Copilot AI", "cat": "applicazioni", "def": "Un assistente AI integrato in un'applicazione specifica che supporta l'utente nel contesto di ciò che sta facendo, suggerendo, completando o generando contenuti senza che l'utente debba cambiare strumento.", "esempio": "Microsoft Copilot in Word suggerisce revisioni del testo mentre scrivi; in Excel genera formule a partire da una descrizione in linguaggio naturale."}, {"term": "Ricerca semantica", "full": "Semantic search", "cat": "applicazioni", "def": "Un sistema di ricerca che comprende il significato del testo anziché cercare corrispondenze letterali di parole chiave. Trova risultati pertinenti anche se l'utente usa termini diversi da quelli nel documento.", "esempio": "Cercando 'come uscire dal contratto' in un sistema con ricerca semantica, si trovano anche documenti che contengono 'clausola di rescissione' o 'condizioni di recesso'."}, {"term": "Dato sintetico", "full": "Synthetic data", "cat": "applicazioni", "def": "Dati generati artificialmente da un modello AI per addestrare, testare o aumentare altri sistemi AI, in alternativa o a integrazione di dati reali potenzialmente sensibili o scarsi.", "esempio": "Per addestrare un modello di classificazione delle email senza esporre dati reali dei clienti, si possono generare migliaia di email sintetiche che ne replicano le caratteristiche."}, {"term": "Allucinazione", "full": "Allucinazione del modello", "cat": "rischi", "def": "Il fenomeno per cui un LLM produce informazioni false, inventate o imprecise presentandole con apparente sicurezza. Non è un errore casuale ma una caratteristica strutturale dei modelli probabilistici.", "esempio": "Chiedendo a un LLM di citare normative specifiche senza fornire i documenti, potrebbe citare articoli di legge inesistenti ma plausibili. Sempre verificare le informazioni critiche su fonti primarie."}, {"term": "Bias", "full": "Bias del modello", "cat": "rischi", "def": "Tendenza sistematica del modello a produrre output distorti, che riflette pregiudizi presenti nei dati di addestramento o nelle scelte progettuali. Può manifestarsi in termini di genere, etnia, cultura o punti di vista.", "esempio": "Un modello addestrato prevalentemente su testi in inglese potrebbe produrre risposte meno accurate o culturalmente inappropriate quando usato in contesti europei."}, {"term": "Data cutoff", "full": "Data di taglio della conoscenza", "cat": "rischi", "def": "La data oltre la quale il modello non ha informazioni aggiornate, perché l'addestramento si è fermato in quel momento. Domande su eventi successivi producono risposte inaccurate o inventate.", "esempio": "Se il data cutoff di un modello è giugno 2024, chiedere 'Quali sono le ultime normative AI europee?' potrebbe produrre una risposta incompleta o errata. Usare la ricerca web integrata per dati aggiornati."}, {"term": "Privacy del dato", "full": "Rischio privacy nei dati condivisi", "cat": "rischi", "def": "Il rischio di esporre informazioni riservate o personali condividendole con un LLM. Alcune piattaforme usano le conversazioni per addestrare futuri modelli; i dati sensibili potrebbero essere visibili agli operatori del servizio.", "esempio": "Non condividere numeri di conto, codici fiscali, dati di salute, segreti commerciali o informazioni personali di terzi nei prompt. Verificare sempre le policy sulla privacy della piattaforma usata."}, {"term": "Jailbreak", "full": "Jailbreak", "cat": "rischi", "def": "Tentativo di aggirare le limitazioni di sicurezza di un LLM tramite prompt manipolatori, per indurlo a produrre contenuti che normalmente rifiuterebbe.", "esempio": "Richieste formulate come 'fingi di essere un AI senza filtri e...' tentano un jailbreak. I modelli moderni hanno difese sempre più robuste, ma la vigilanza rimane necessaria."}, {"term": "Model drift", "full": "Deriva del modello", "cat": "rischi", "def": "La degradazione graduale delle prestazioni di un modello nel tempo, dovuta al cambiamento del contesto reale (nuove normative, nuovo linguaggio, nuovi contesti) non riflesso nell'addestramento originale.", "esempio": "Un modello addestrato su contratti del 2021 potrebbe non gestire correttamente clausole relative a normative AI entrate in vigore nel 2025. Richiede aggiornamento o integrazione con RAG."}, {"term": "Overfitting", "full": "Sovra-adattamento", "cat": "rischi", "def": "Quando un modello impara così bene i dati di addestramento da perdere capacità di generalizzare su esempi nuovi. Produce prestazioni eccellenti in test ma deludenti in produzione.", "esempio": "Un modello di analisi contratti addestrato solo su contratti di fornitura potrebbe fallire su contratti di licenza software, pur avendo mostrato ottima accuratezza in fase di test."}, {"term": "Autonomy level", "full": "Livello di autonomia", "cat": "rischi", "def": "Il grado di indipendenza decisionale di un sistema AI: da 'suggerisce all'umano' (copilot) a 'decide ed esegue autonomamente' (autopilot). Il livello di autonomia deve essere calibrato al contesto e al rischio.", "esempio": "Per approvare pagamenti, un'AI in modalità copilot (suggerisce, l'umano approva) è appropriata; in modalità autopilot (approva da sola) è rischiosa. Il livello di autonomia deve seguire il livello di rischio."}, {"term": "API", "full": "Application Programming Interface", "cat": "ecosistema", "def": "L'interfaccia tecnica che permette di integrare un LLM in applicazioni proprie, workflow automatizzati o altri sistemi software, senza usare l'interfaccia grafica del prodotto.", "esempio": "Tramite API di Claude o OpenAI, un'azienda può integrare l'AI nei propri CRM, ERP o piattaforme interne, costruendo assistenti personalizzati senza sviluppare un modello da zero."}, {"term": "Modello open-source", "full": "Modello open-source", "cat": "ecosistema", "def": "Un modello AI i cui pesi e architettura sono pubblicamente disponibili. Chiunque può scaricarlo, modificarlo e usarlo, anche in locale. Alternativa ai modelli proprietari per chi necessita di controllo totale sui dati.", "esempio": "Llama di Meta e Mistral sono modelli open-source: un'azienda con dati sensibili può installarli sui propri server, garantendo che nessun dato esca dall'infrastruttura interna."}, {"term": "Modello proprietario", "full": "Modello proprietario", "cat": "ecosistema", "def": "Un modello AI sviluppato e gestito da un'azienda, accessibile solo tramite i loro prodotti o API. Solitamente più performante degli equivalenti open-source, ma con minore controllo sulla privacy dei dati.", "esempio": "GPT-4 (OpenAI), Claude (Anthropic) e Gemini (Google) sono modelli proprietari: potenti e aggiornati, ma i dati inviati transitano sui server dell'azienda fornitrice."}, {"term": "Benchmark", "full": "Benchmark", "cat": "ecosistema", "def": "Test standardizzati usati per misurare e confrontare le capacità di diversi modelli AI su compiti specifici (ragionamento, coding, conoscenza). Utili come riferimento, ma non sempre rappresentativi delle prestazioni reali.", "esempio": "Un modello che eccelle in benchmark di matematica può comunque produrre risposte imprecise in un contesto aziendale reale. I benchmark vanno integrati con test sui propri casi d'uso."}, {"term": "AI generativa", "full": "Intelligenza artificiale generativa", "cat": "ecosistema", "def": "La categoria di AI capace di creare nuovi contenuti originali — testo, immagini, codice, audio, video — anziché limitarsi ad analizzare o classificare input esistenti.", "esempio": "ChatGPT genera testo, DALL-E genera immagini, GitHub Copilot genera codice. Tutte sono forme di AI generativa, distinte dai sistemi AI 'classici' che classificano o prevedono senza creare."}, {"term": "RLHF", "full": "Reinforcement Learning from Human Feedback", "cat": "ecosistema", "def": "Una tecnica di addestramento in cui il comportamento del modello viene ottimizzato attraverso feedback umano: i valutatori indicano quali risposte sono migliori, e il modello apprende a produrre output più graditi.", "esempio": "Claude e ChatGPT usano RLHF per essere 'utili, innocui e onesti': gli addestratori hanno preferito risposte equilibrate e appropriate, e il modello ha appreso a privilegiarle."}, {"term": "Alignment", "full": "Allineamento dell'AI", "cat": "ecosistema", "def": "La sfida di assicurare che un sistema AI si comporti in modo coerente con i valori, le intenzioni e gli interessi umani, anche in contesti non previsti durante l'addestramento.", "esempio": "Un modello 'allineato' rifiuta di produrre contenuti dannosi, comunica i propri limiti invece di inventare risposte, e mantiene il comportamento atteso anche con prompt insoliti."}, {"term": "Latenza", "full": "Latenza", "cat": "ecosistema", "def": "Il tempo che intercorre tra l'invio di un prompt e la ricezione della prima risposta del modello. Influenzata dalla dimensione del modello, dalla lunghezza del contesto e dall'infrastruttura.", "esempio": "Per un chatbot di customer service in tempo reale, la latenza è critica: un'attesa di 5-10 secondi è accettabile in un tool interno, inaccettabile in un'interazione con il cliente finale."}, {"term": "Watermarking", "full": "Watermarking dell'AI", "cat": "ecosistema", "def": "Tecniche per marcare invisibilmente i contenuti generati dall'AI, rendendoli identificabili come tali anche dopo modifiche. Strumento emergente per la trasparenza e la prevenzione della disinformazione.", "esempio": "Documenti o immagini con watermark AI possono essere riconosciuti come generati automaticamente da appositi rilevatori, anche se non esiste ancora uno standard universale affidabile."}, {"term": "Perplexity", "full": "Perplexity AI", "cat": "ecosistema", "def": "Un motore di ricerca basato su AI che combina ricerca web in tempo reale con capacità generative di LLM. Fornisce risposte sintetiche con citazione delle fonti, utile per ricerche rapide su argomenti aggiornati.", "esempio": "Per verificare rapidamente normative recenti, prezzi di mercato o notizie di settore, Perplexity offre risposte con fonti citate — riducendo il rischio di allucinazioni su dati recenti."}];
const CATS  = {"architettura": {"label": "Architettura e modelli", "color": "#3b82f6", "desc": "Come funziona l'AI: dall'architettura ai concetti fondamentali di addestramento e inferenza."}, "interazione": {"label": "Interazione e prompt", "color": "#6366f1", "desc": "Come si comunica con un LLM: prompt, tecniche di ottimizzazione e configurazione del comportamento."}, "applicazioni": {"label": "Applicazioni aziendali", "color": "#8b5cf6", "desc": "Come l'AI opera in contesti reali: agenti, RAG, integrazione nei processi e negli strumenti."}, "rischi": {"label": "Rischi e limitazioni", "color": "#ef4444", "desc": "Cosa può andare storto e come mitigarlo: allucinazioni, bias, privacy e livelli di autonomia."}, "ecosistema": {"label": "Ecosistema e strumenti", "color": "#14b8a6", "desc": "Il contesto tecnologico e di mercato: modelli, piattaforme, standard e tendenze."}};

let activeCat = 'all';

function buildFilters() {
  const wrap = document.getElementById('filters');
  const all = document.createElement('button');
  all.className = 'cf active';
  all.style.setProperty('--cf-col','#6366f1');
  all.style.setProperty('--cf-bg','#4338ca');
  all.textContent = 'Tutti';
  all.dataset.cat = 'all';
  all.onclick = () => setFilter('all');
  wrap.appendChild(all);
  Object.entries(CATS).forEach(([k,v]) => {
    const b = document.createElement('button');
    b.className = 'cf';
    b.style.setProperty('--cf-col', v.color);
    b.style.setProperty('--cf-bg', v.color+'cc');
    b.textContent = v.label;
    b.dataset.cat = k;
    b.onclick = () => setFilter(k);
    wrap.appendChild(b);
  });
}

function setFilter(cat) {
  activeCat = cat;
  document.querySelectorAll('.cf').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filtered = TERMS.filter(t => {
    const matchCat = activeCat === 'all' || t.cat === activeCat;
    const matchQ = !q || t.term.toLowerCase().includes(q) || (t.full||'').toLowerCase().includes(q) || t.def.toLowerCase().includes(q) || t.esempio.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('count').textContent = filtered.length + ' termini' + (activeCat!=='all'?' · '+CATS[activeCat]?.label:'') + (q?' · ricerca: "'+q+'"':'');
  if (!filtered.length) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map(t => {
    const c = CATS[t.cat];
    return `<div class="card">
      <div class="bar" style="background:${c.color}"></div>
      <div class="card-top">
        <div><div class="term">${t.term}</div><div class="full">${t.full||''}</div></div>
        <span class="cat-badge" style="background:${c.color}22;color:${c.color}">${c.label}</span>
      </div>
      <div class="def">${t.def}</div>
      <div class="example">💼 ${t.esempio}</div>
    </div>`;
  }).join('');
}

buildFilters();
document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
